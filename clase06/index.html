<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Videojuegos</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

       
        .card {
            width: 300px;
            margin: 40px auto;

            background: #111;
            border: 1px solid #333;
            border-radius: 14px;

            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        
        .contenido {
            padding: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
        }

        
        h1 {
            color: #22d3ee;
        }

        h2 {
            color: #a855f7;
        }

        
        p {
            color: #e6f1ff;
        }

        
        .btn {
            display: inline-block;

            padding: 12px 24px;
            margin-top: 10px;

            border-radius: 30px;

            background: linear-gradient(135deg, #22d3ee, #a855f7);

            color: black;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;
        }

        
        
        .btn:hover {
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://www.gaceta.unam.mx/wp-content/uploads/2023/08/230831-Aca9-des-f1-videojuegos.jpg" alt="Videojuego">

        <div class="contenido">

            <h1>Videojuegos</h1>

            <h2>Video Game Style</h2>

            <p>
                Explora diferentes videojuegos y descubre nuevas aventuras.
            </p>

            <a href=" https://juanchisescobar2022-ctrl.github.io/Herramientas-programacion/" class="btn">
                Ver más
            </a>

        </div>

    </div>

</body>

</html>
